<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 50" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#0c1622" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>
    <linearGradient id="edge4_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0" />
      <stop offset="20%" stop-color="#00ff66" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#00ff66" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Box -->
  <rect x="2" y="2" width="896" height="46" rx="4" fill="url(#bg4_grad)" stroke="#1f2d3d" stroke-width="1.2" />
  <line x1="10" y1="47" x2="890" y2="47" stroke="url(#edge4_grad)" stroke-width="1.8" />
  
  <!-- Corner Brackets -->
  <path d="M 4 14 L 4 4 L 14 4" fill="none" stroke="#00e5ff" stroke-width="1.8" />
  <path d="M 896 14 L 896 4 L 886 4" fill="none" stroke="#00ff66" stroke-width="1.8" />
  <path d="M 896 36 L 896 46 L 886 46" fill="none" stroke="#00e5ff" stroke-width="1.8" />
  <path d="M 4 36 L 4 46 L 14 46" fill="none" stroke="#00ff66" stroke-width="1.8" />
  
  <!-- Zone Badge Pill -->
  <rect x="18" y="11" width="105" height="28" rx="3" fill="#060b11" stroke="#00e5ff" stroke-width="0.8" />
  <text x="70" y="29" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00e5ff" text-anchor="middle" letter-spacing="1.5">[ZONE // 04]</text>
  
  <!-- Pulsing Transmission Beacon -->
  <circle cx="140" cy="25" r="3.5" fill="#00ff66">
    <animate attributeName="r" values="3;5;3" dur="1.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="140" cy="25" r="3.5" fill="none" stroke="#00ff66" stroke-width="0.8">
    <animate attributeName="r" values="3.5;10" dur="1.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite" />
  </circle>

  <!-- Section Title -->
  <text x="160" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="2.5">TRANSMISSIONS</text>
  
  <!-- Right Handshake Ready Tag -->
  <rect x="710" y="11" width="172" height="28" rx="3" fill="#060b11" stroke="#1f2d3d" stroke-width="0.8" />
  <circle cx="725" cy="25" r="3" fill="#00ff66" />
  <text x="802" y="29" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#00ff66" text-anchor="middle" letter-spacing="1.2">HANDSHAKE: READY</text>
</svg>