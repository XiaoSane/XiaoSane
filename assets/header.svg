<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#0a1017" />
      <stop offset="100%" stop-color="#04070a" />
    </linearGradient>

    <!-- Animated Dynamic Cyber Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66">
        <animate attributeName="stop-color" values="#00ff66;#00e5ff;#38bdf8;#00ff66" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#38bdf8;#00ff66;#00e5ff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ff66">
        <animate attributeName="stop-color" values="#00ff66;#00e5ff;#38bdf8;#00ff66" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Laser Scanner Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0" />
      <stop offset="25%" stop-color="#00ff66" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#00ff66" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#00ff66" stroke-width="0.5" opacity="0.07" />
    </pattern>

    <!-- Corner Bracket Def -->
    <g id="corner">
      <path d="M 0 12 L 0 0 L 12 0" fill="none" stroke="#00ff66" stroke-width="1.8">
        <animate attributeName="stroke" values="#00ff66;#00e5ff;#00ff66" dur="3s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Clip Path for Typewriter Title (Base width 480 ensures full visibility on static fallback) -->
    <clipPath id="typeClip">
      <rect x="40" y="55" width="480" height="45">
        <animate attributeName="width" values="0; 480; 480; 0" keyTimes="0; 0.45; 0.85; 1" dur="7s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace; }
      .mono { font-family: 'Courier New', Courier, monospace; }
      .glow-text {
        text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="900" height="200" fill="url(#bgGrad)" />
  <rect width="900" height="200" fill="url(#cyberGrid)" />

  <!-- Animated Laser Beam Scanner -->
  <g>
    <line x1="15" y1="0" x2="885" y2="0" stroke="url(#scanGrad)" stroke-width="1.8">
      <animateTransform attributeName="transform" type="translate" values="0 15; 0 185; 0 15" dur="4.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Outer Cyber Border with Breathing Glow -->
  <rect x="12" y="12" width="876" height="176" fill="none" stroke="#1f2d3d" stroke-width="1.2">
    <animate attributeName="stroke" values="#1f2d3d;#00ff66;#1f2d3d" dur="5s" repeatCount="indefinite" />
  </rect>
  <rect x="15" y="15" width="870" height="170" fill="none" stroke="#00ff66" stroke-width="0.6" opacity="0.25" />

  <!-- Corner Accents -->
  <use href="#corner" x="12" y="12" />
  <use href="#corner" x="888" y="12" transform="rotate(90 888 12)" />
  <use href="#corner" x="888" y="188" transform="rotate(180 888 188)" />
  <use href="#corner" x="12" y="188" transform="rotate(270 12 188)" />

  <!-- ROW 1: Top System Status Bar -->
  <rect x="22" y="20" width="856" height="24" fill="#0d1520" opacity="0.85" rx="2" />
  <text x="34" y="36" class="mono" font-size="10.5" fill="#00ff66" font-weight="bold" letter-spacing="1.8">
    [SYS_BOOT // SEC_LEVEL_03] — INTEGRITY: VERIFIED [SHA-256] — ZERO-TRUST ACTIVE
  </text>
  
  <!-- Pulsing LED Beacon + Radar Ring -->
  <circle cx="860" cy="32" r="3.5" fill="#00ff66">
    <animate attributeName="r" values="3;4.5;3" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="860" cy="32" r="3.5" fill="none" stroke="#00ff66" stroke-width="0.8">
    <animate attributeName="r" values="3.5;11" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- ROW 2: Title Section (x=45 to x=480) -->
  <g clip-path="url(#typeClip)">
    <text x="45" y="86" font-size="32" fill="#ffffff" font-weight="900" letter-spacing="4" class="glow-text">
      THE ARCHIVE OF PREM
    </text>
  </g>

  <!-- Blinking Typewriter Cursor -->
  <rect x="45" y="62" width="3.5" height="28" fill="#00ff66">
    <animate attributeName="x" values="45; 455; 455; 45" keyTimes="0; 0.45; 0.85; 1" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1; 0; 1" dur="0.8s" repeatCount="indefinite" />
  </rect>

  <!-- Animated Neon Accent Underline -->
  <rect x="45" y="96" width="430" height="2.5" fill="url(#laserGrad)">
    <animate attributeName="width" values="0; 430; 430; 0" keyTimes="0; 0.45; 0.85; 1" dur="7s" repeatCount="indefinite" />
  </rect>
  <rect x="485" y="97" width="10" height="1" fill="#00e5ff" />
  <rect x="500" y="97" width="5" height="1" fill="#00ff66" />

  <!-- ROW 2 Right: Dedicated Spectrum HUD Box (x=660 to x=865, no overlap with title) -->
  <g transform="translate(660, 56)">
    <rect width="205" height="44" rx="3" fill="#080f18" stroke="#1f2d3d" stroke-width="0.8">
      <animate attributeName="stroke" values="#1f2d3d;#00e5ff;#1f2d3d" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="10" y="16" class="mono" font-size="8.5" fill="#00e5ff" font-weight="bold" letter-spacing="1.2">
      [ SPECTRUM // FREQ ]
    </text>
    <text x="10" y="32" class="mono" font-size="8.5" fill="#94a3b8" letter-spacing="0.8">
      TLS 1.3 • AES-256
    </text>

    <!-- Spectrum Bars -->
    <g transform="translate(145, 34)">
      <rect x="0" y="-8" width="3" height="8" fill="#00ff66">
        <animate attributeName="height" values="3;12;5;14;3" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="-3;-12;-5;-14;-3" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="6" y="-8" width="3" height="8" fill="#00e5ff">
        <animate attributeName="height" values="8;4;14;6;8" dur="1.0s" repeatCount="indefinite" />
        <animate attributeName="y" values="-8;-4;-14;-6;-8" dur="1.0s" repeatCount="indefinite" />
      </rect>
      <rect x="12" y="-8" width="3" height="8" fill="#38bdf8">
        <animate attributeName="height" values="12;6;3;12;12" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="-12;-6;-3;-12;-12" dur="1.4s" repeatCount="indefinite" />
      </rect>
      <rect x="18" y="-8" width="3" height="8" fill="#00ff66">
        <animate attributeName="height" values="5;14;7;4;5" dur="0.9s" repeatCount="indefinite" />
        <animate attributeName="y" values="-5;-14;-7;-4;-5" dur="0.9s" repeatCount="indefinite" />
      </rect>
      <rect x="24" y="-8" width="3" height="8" fill="#00e5ff">
        <animate attributeName="height" values="10;3;13;8;10" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="-10;-3;-13;-8;-10" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="30" y="-8" width="3" height="8" fill="#38bdf8">
        <animate attributeName="height" values="4;12;6;14;4" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="-4;-12;-6;-14;-4" dur="1.3s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- ROW 3: Dedicated Subtitle Row (y=128, fully clear of all elements) -->
  <text x="45" y="128" class="mono" font-size="11.5" fill="#00e5ff" font-weight="bold" letter-spacing="2">
    DEFENSIVE CYBERSECURITY // SECURE APPLICATION ARCHITECTURE // AI &amp; RAG
  </text>

  <!-- ROW 4: Dedicated System Telemetry Status Row (y=158) -->
  <text x="45" y="158" class="mono" font-size="10" fill="#94a3b8" letter-spacing="1.2">
    NODE: <tspan fill="#00ff66" font-weight="bold">@XiaoSane</tspan>  •  DEFENSE: <tspan fill="#00e5ff">ACTIVE [NIST 800-207]</tspan>  •  UPTIME: <tspan fill="#22c55e">99.98%</tspan>  •  STATUS: <tspan fill="#00ff66">NOMINAL</tspan>
  </text>

  <!-- Accent Bottom Line -->
  <line x1="45" y1="172" x2="855" y2="172" stroke="#1f2d3d" stroke-width="0.8" />
  <line x1="45" y1="172" x2="180" y2="172" stroke="#00ff66" stroke-width="1" />
</svg>